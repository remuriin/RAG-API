# On a push to main: check the backend, build its container image and push it to ghcr.io.
# Flux, in the cluster, sees the new main-<commit>-<commit time> tag and deploys it (repo Fleet):
# the management API first, then the control agent, which moves every client's service to its build.
# The VPS never builds anything, and nothing here logs in to it.
name: image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'k8s/client.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
  # also a "Run workflow" button on the Actions page
  workflow_dispatch:

# only pushes to this repository run it; a pull request from a fork never does
permissions:
  contents: read
  packages: write

# two pushes in a row build one after the other, never at once
concurrency: image

jobs:
  # the checks that need no database, no model and no cluster
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-agent.ts
      - run: npx tsx scripts/check-history.ts
      - run: npx tsx scripts/check-convert.ts
      - run: npx tsx scripts/check-persona.ts

  build:
    needs: check
    # an ARM machine, the same kind of CPU as the VPS, so nothing is emulated
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # the commit's own time, for the tag Flux sorts by: re-running an old run never sorts above a newer build
      - name: commit time
        id: ts
        run: echo "ts=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "tsc" runs inside this build, so a type error stops the workflow here
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # one tag that names this exact commit, "main" that always points at the newest,
          # and main-<commit>-<commit time>, the one Flux picks the newest build by
          tags: |
            ghcr.io/remuriin/rag-api:${{ github.sha }}
            ghcr.io/remuriin/rag-api:main
            ghcr.io/remuriin/rag-api:main-${{ github.sha }}-${{ steps.ts.outputs.ts }}
          # the image is told its own name, commit included (see the Dockerfile)
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/remuriin/RAG-API
