# On a push to main: check the backend, build its container image, and make the cluster run it.
# The VPS never builds anything.
name: image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'k8s/client.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
  # also a "Run workflow" button on the Actions page
  workflow_dispatch:

# only pushes to this repository run it; a pull request from a fork never does
permissions:
  contents: read
  packages: write

# two pushes in a row build one after the other, never at once
concurrency: image

jobs:
  # the checks that need no database, no model and no cluster
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-agent.ts
      - run: npx tsx scripts/check-history.ts
      - run: npx tsx scripts/check-convert.ts
      - run: npx tsx scripts/check-persona.ts

  build:
    needs: check
    # an ARM machine, the same kind of CPU as the VPS, so nothing is emulated
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "tsc" runs inside this build, so a type error stops the workflow here
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # one tag that names this exact commit, and "main" that always points at the newest
          tags: |
            ghcr.io/remuriin/rag-api:${{ github.sha }}
            ghcr.io/remuriin/rag-api:main
          # the image is told its own name, commit included (see the Dockerfile)
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/remuriin/RAG-API

  # Logs in to the VPS as the "deploy" user. This repository's key can do one thing there: ask for a
  # deployment in the rem-raas-backend namespace to run the image of a commit (k8s-deploy in the Cluster
  # repository). That script waits for the new pod, and goes back to the old image by itself if it is
  # not healthy, which makes this job fail.
  #
  # The management API goes first: it brings the database up to date before it starts. Then the control
  # agent, which is only "healthy" once it has moved every client's service to this build, one at a
  # time. So a build that breaks the services fails here too, and the services go back with the agent.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: make the cluster run this commit
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "the DEPLOY_KEY secret is not set"; exit 1; }
          mkdir -p ~/.ssh
          # the VPS's public host key, so the key is only ever offered to the real VPS
          echo "140.245.60.8 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBanLnPlG+CZMZyISZMZcqZRg3x0MIBK7sYoCjenpObq" > ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/deploy
          echo "$DEPLOY_KEY" > ~/.ssh/deploy
          ssh -i ~/.ssh/deploy deploy@140.245.60.8 "management $GITHUB_SHA"
          ssh -i ~/.ssh/deploy deploy@140.245.60.8 "agent $GITHUB_SHA"
