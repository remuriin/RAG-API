# The backend's two namespaces in the VPS's Kubernetes cluster.
#
#   rem-raas-backend   the management API and the control agent
#   rem-raas-clients   one pod per client service, made and removed by the control agent
#
# Two, not one: the agent's permission to create and delete things is given for rem-raas-clients only,
# so it can never touch the management API or itself. And a deploy key belongs to one namespace, so
# this repository's key reaches rem-raas-backend and nothing else (the web app lives in rem-raas).
apiVersion: v1
kind: Namespace
metadata:
  name: rem-raas-backend
---
apiVersion: v1
kind: Namespace
metadata:
  name: rem-raas-clients
