# The management API (the dashboard's backend): "keep one pod of the backend's image running as the
# management API", and a fixed address for that pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management
  namespace: rem-raas-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management
  template:
    metadata:
      labels:
        app: management
    spec:
      # the dashboard's uploads pass through here and can run for close to four minutes; a pod being
      # replaced gets this long to finish the ones it already has
      terminationGracePeriodSeconds: 300
      # the management API never talks to Kubernetes, so it gets no login for it
      automountServiceAccountToken: false
      containers:
        - name: management
          # ":main" is the newest build of the main branch. A deploy replaces it with one exact build.
          image: ghcr.io/remuriin/rag-api:main
          imagePullPolicy: Always
          # The database is brought up to date first, by the same build that is about to use it, so
          # new code never meets an old database. "exec" makes the API the process that gets the stop signal.
          command: ["sh", "-c", "node dist/scripts/migrate.js && exec node dist/src/management/server.js"]
          ports:
            - containerPort: 4050
          # every setting of management.env, from a secret created by hand on the VPS (see deploy/README.md).
          # The values are never in this repository or in the image.
          envFrom:
            - secretRef:
                name: management-env
          env:
            - name: MGMT_PORT
              value: "4050"
            # inside a pod "127.0.0.1" would be reachable by nobody
            - name: MGMT_HOST
              value: "0.0.0.0"
            # how a client's service is reached: by the name the control agent gave it
            - name: INSTANCE_URL
              value: "http://rag-{id}.rem-raas-clients.svc.cluster.local"
          # /api/ready asks the database only. /api/health also answers 503 for a silent agent,
          # which as a readiness check would take the whole API out of service with it.
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 4050
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# 10.43.0.83: the address the VPS's nginx sends /api to.
apiVersion: v1
kind: Service
metadata:
  name: management
  namespace: rem-raas-backend
spec:
  type: ClusterIP
  clusterIP: 10.43.0.83
  selector:
    app: management
  ports:
    - port: 80
      targetPort: 4050
