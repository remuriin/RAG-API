# nginx's own error pages are HTML; API clients expect JSON.
# Install as /etc/nginx/snippets/rag-errors.conf. It is a snippet, and not part of the site file,
# so a message can be changed by copying this file again (the site file is edited by certbot and
# must not be copied over).

error_page 413 = @too_large;
error_page 429 = @rate_limited;
error_page 502 504 = @unavailable;

location @too_large {
    default_type application/json;
    return 413 '{"error":"The request is too large. A PDF can be up to 10 MB, other files up to 500 KB."}';
}
location @rate_limited {
    default_type application/json;
    return 429 '{"error":"Too many requests. Wait a few seconds and try again."}';
}
location @unavailable {
    default_type application/json;
    return 503 '{"error":"The service is not responding right now. Try again in a moment."}';
}
