# Route for every client service: /i/<id>/... goes to that service's pod in the VPS's Kubernetes cluster.
# Install as /etc/nginx/snippets/rag-instances.conf; the site file pulls it in with:
#   include /etc/nginx/snippets/rag-instances.conf;
#
# One rule for all services, never edited when a service is created or deleted. The control agent
# gives each service's pod the name rag-<id> (namespace rem-raas-clients); nginx asks the cluster's own
# name lookup (10.43.0.10) where that is, per request. An id with no pod behind it does not resolve,
# which ends in the JSON 503 of rag-errors.conf.

# /i/<id> without the slash at the end: sent on to /i/<id>/
location ~ "^/i/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
    return 301 $scheme://$host$uri/;
}

location ~ "^/i/(?<rag_id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?<rag_path>/.*)$" {
    limit_req zone=rag_api burst=10 nodelay;
    include /etc/nginx/snippets/rag-headers.conf;

    # a name is looked up again after 10 seconds, so a deleted service stops resolving quickly
    resolver 10.43.0.10 valid=10s ipv6=off;
    resolver_timeout 5s;

    # strips /i/<id>, so the service sees /health, /documents, /query
    rewrite ^ $rag_path break;
    proxy_pass http://rag-$rag_id.rem-raas-clients.svc.cluster.local;

    # uploads wait for chunking and embedding before replying
    proxy_read_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
