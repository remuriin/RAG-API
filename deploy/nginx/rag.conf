# Site for all RAG instances.
# Install as /etc/nginx/sites-available/rag.conf and symlink into sites-enabled.
# HTTPS is added afterwards by: sudo certbot --nginx -d rag.140-245-60-8.sslip.io

# Per-client-IP limit so one caller can't burn through the shared Gemini quota
limit_req_zone $binary_remote_addr zone=rag_api:10m rate=5r/s;

server {
    listen 80;
    server_name rag.140-245-60-8.sslip.io;

    # the API itself rejects documents over 500 KB
    client_max_body_size 1m;

    # one small route file per instance (see instance.conf.example)
    include /etc/nginx/rag-instances/*.conf;

    # management API (the path is passed through unchanged, so it sees /api/...)
    location /api/ {
        limit_req zone=rag_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
