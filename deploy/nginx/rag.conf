# Site for the RAG service: the web app at /, the management API at /api/, one route per instance at /i/<id>/.
# Install as /etc/nginx/sites-available/rag.conf and symlink into sites-enabled.
# HTTPS is added afterwards by certbot (sudo certbot --nginx -d rag.remservers.me), which edits this file in place.
#
# Snippets this file expects in /etc/nginx/snippets/ (all from deploy/nginx/):
#   rag-headers.conf        security headers        (headers.conf)
#   rag-api.conf            the management API      (api-location.conf)
#   rag-app.conf            the web app             (app-location.conf)
#   rag-instance.template   per-instance route      (instance.conf.example; used by rag-ctl, not included here)

# Per-client-IP limit so one caller can't burn through the shared Gemini quota.
# Rejected requests get a 429 with a JSON body (see the error_page lines below), not nginx's HTML page.
limit_req_zone $binary_remote_addr zone=rag_api:10m rate=5r/s;
limit_req_status 429;
limit_req_log_level warn;

# don't advertise the nginx version
server_tokens off;

# the build's js and css compress well; nginx's default only compresses html
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name rag.remservers.me rag.140-245-60-8.sslip.io;

    # the API itself rejects documents over 500 KB
    client_max_body_size 1m;

    # nginx's own error pages are HTML; API clients expect JSON
    error_page 413 = @too_large;
    error_page 429 = @rate_limited;
    error_page 502 504 = @unavailable;

    location @too_large {
        default_type application/json;
        return 413 '{"error":"The request is too large. Files can be up to 500 KB."}';
    }
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Too many requests. Wait a few seconds and try again."}';
    }
    location @unavailable {
        default_type application/json;
        return 503 '{"error":"The service is not responding right now. Try again in a moment."}';
    }

    # one small route file per instance, written by rag-ctl
    include /etc/nginx/rag-instances/*.conf;

    # management API
    include /etc/nginx/snippets/rag-api.conf;

    # the web app, and the 404 for unknown /i/ addresses
    include /etc/nginx/snippets/rag-app.conf;
}
