# The web app (the dashboard), served at /. Install as /etc/nginx/snippets/rag-app.conf
# and include it in the site file in place of the old "location / { return 404; }".
#
# The app runs as a container in the VPS's Kubernetes cluster (namespace rem-raas, see the
# Fleet repository's apps/raas/, run by Flux). nginx finds its Service by name,
# web.rem-raas.svc.cluster.local, through the cluster's own name lookup (10.43.0.10), per request:
# the name stays the same when the Service is re-created, a fixed address would not. That container decides the caching (index.html never cached, /assets/ for a year);
# this file adds what belongs to the site as a whole: the security headers and the
# Content-Security-Policy.

# only the page itself may be framed by nobody and may run scripts from nowhere but here and Firebase
set $app_csp "default-src 'self'; script-src 'self' https://apis.google.com; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://rag-service-remuriin.firebaseapp.com; frame-src https://rag-service-remuriin.firebaseapp.com https://accounts.google.com https://github.com; img-src 'self' data: https://*.googleusercontent.com https://avatars.githubusercontent.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'";

# in a variable, so nginx looks the name up per request through the resolver, not once at start
set $raas_web web.rem-raas.svc.cluster.local;

location /assets/ {
    include /etc/nginx/snippets/rag-headers.conf;
    resolver 10.43.0.10 valid=10s ipv6=off;
    proxy_pass http://$raas_web;
    proxy_set_header Host $host;
}

location / {
    include /etc/nginx/snippets/rag-headers.conf;
    add_header Content-Security-Policy $app_csp always;
    resolver 10.43.0.10 valid=10s ipv6=off;
    proxy_pass http://$raas_web;
    proxy_set_header Host $host;
}

# An address under /i/ that no instance route matched: a deleted or mistyped service.
# Without this, such requests would get the dashboard's HTML with a 200.
location /i/ {
    default_type application/json;
    return 404 '{"error":"Unknown service"}';
}
