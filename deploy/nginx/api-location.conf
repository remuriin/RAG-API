# Route for the management API. Install as /etc/nginx/snippets/rag-api.conf;
# the site file pulls it in with: include /etc/nginx/snippets/rag-api.conf;
# The path is passed through unchanged, so the API sees /api/...

location /api/ {
    limit_req zone=rag_api burst=10 nodelay;
    include /etc/nginx/snippets/rag-headers.conf;
    # the management API's pod in the VPS's Kubernetes cluster (namespace rem-raas-backend, see k8s/management.yaml).
    # 10.43.0.83 is its service's fixed address, which exists only inside this machine.
    proxy_pass http://10.43.0.83;

    # the dashboard uploads files through this route, and an upload waits for chunking and embedding
    proxy_read_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
