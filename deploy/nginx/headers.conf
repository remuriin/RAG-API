# Security headers, sent with every reply. Install as /etc/nginx/snippets/rag-headers.conf.
# nginx drops a parent's add_header lines as soon as a location has its own, so every location
# includes this file itself instead of relying on one copy in the server block.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
